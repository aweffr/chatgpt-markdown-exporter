<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>导出测试对话 | ChatGPT</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, sans-serif;
      }
      body {
        margin: 0;
        background: Canvas;
        color: CanvasText;
      }
      header {
        position: sticky;
        top: 0;
        padding: 12px 20px;
        border-bottom: 1px solid color-mix(in srgb, CanvasText 18%, transparent);
        background: Canvas;
      }
      header button {
        margin-inline-end: 8px;
      }
      main {
        max-width: 760px;
        margin: 0 auto;
        padding: 24px 56px 150px;
      }
      section {
        margin: 22px 0;
      }
      [data-chatgpt-search-message-ids] {
        position: relative;
        padding: 18px;
        border-radius: 16px;
        background: color-mix(in srgb, CanvasText 6%, Canvas);
      }
      [data-chatgpt-search-unit-key="turn:user"] {
        margin-inline-start: 15%;
      }
      [data-markdown-text-style] {
        line-height: 1.6;
      }
      table {
        border-collapse: collapse;
      }
      th,
      td {
        padding: 5px 10px;
        border: 1px solid color-mix(in srgb, CanvasText 25%, transparent);
      }
      pre {
        overflow: auto;
        padding: 12px;
        border-radius: 8px;
        background: color-mix(in srgb, CanvasText 10%, Canvas);
      }
      form {
        position: fixed;
        inset-inline: 0;
        bottom: 0;
        display: flex;
        justify-content: center;
        padding: 18px;
        background: Canvas;
      }
      form > div {
        position: relative;
        width: min(680px, calc(100vw - 32px));
      }
      .composer-surface {
        padding: 8px;
        border: 1px solid color-mix(in srgb, CanvasText 25%, transparent);
        border-radius: 18px;
      }
      .composer-grid {
        display: grid;
        grid-template-columns: auto 1fr auto;
        align-items: center;
        gap: 8px;
      }
      .composer-primary {
        min-width: 0;
      }
      .composer-trailing {
        display: flex;
        align-items: center;
      }
      [contenteditable] {
        flex: 1;
        min-height: 42px;
        resize: none;
      }
    </style>
  </head>
  <body>
    <header aria-label="测试页面控制">
      <button type="button" id="rebuild">重建消息区域</button>
      <button type="button" id="older">显示前文</button>
      <button type="button" id="route">切换对话</button>
      <button type="button" id="generating">模拟正在生成</button>
    </header>
    <main id="conversation">
      <section data-turn-key="user-1" data-testid="conversation-turn-user-1">
        <div class="group/turn-messages">
          <div
            data-chatgpt-search-message-ids="user-1"
            data-chatgpt-search-unit-key="turn:user"
          >
            <div data-user-message-bubble class="whitespace-pre-wrap">
              请只导出我需要的消息。
            </div>
          </div>
        </div>
      </section>
      <section
        data-turn-key="assistant-1"
        data-testid="conversation-turn-assistant-1"
      >
        <div class="group/turn-messages">
          <div
            data-chatgpt-search-message-ids="assistant-1"
            data-chatgpt-search-unit-key="turn:assistant"
            data-message-model-slug="gpt-5-6-thinking"
          >
            <div
              data-chatgpt-selection-message-id="assistant-1"
              data-markdown-text-style="assistant-message"
            >
              <p>
                第一条回答引用了
                <span data-testid="chatgpt-citation"
                  ><a href="https://example.com/source?utm_source=chatgpt.com"
                    >示例来源</a
                  ></span
                >。
              </p>
            </div>
          </div>
        </div>
      </section>
      <section data-turn-key="user-2" data-testid="conversation-turn-user-2">
        <div class="group/turn-messages">
          <div
            data-chatgpt-search-message-ids="user-2"
            data-chatgpt-search-unit-key="turn:user"
          >
            <div data-user-message-bubble class="whitespace-pre-wrap">
              给我代码和表格。
            </div>
          </div>
        </div>
      </section>
      <section
        data-turn-key="assistant-2"
        data-testid="conversation-turn-assistant-2"
      >
        <div class="group/turn-messages">
          <div
            data-chatgpt-search-message-ids="assistant-2"
            data-chatgpt-search-unit-key="turn:assistant"
            data-message-model-slug="gpt-5-6-thinking"
          >
            <div
              data-chatgpt-selection-message-id="assistant-2"
              data-markdown-text-style="assistant-message"
            >
              <p>这是最终答案。</p>
              <div data-markdown-copy="code-block">
                <div data-markdown-copy="exclude">
                  TypeScript<button type="button">复制代码</button>
                </div>
                <div>
                  <code class="language-ts">const answer: number = 42;</code>
                </div>
              </div>
              <table>
                <thead>
                  <tr>
                    <th>项目</th>
                    <th>值</th>
                  </tr>
                </thead>
                <tbody>
                  <tr>
                    <td>答案</td>
                    <td>42</td>
                  </tr>
                </tbody>
              </table>
              <p>
                <button type="button" aria-label="打开图像">
                  <img alt="示意图" src="/image.png" />
                </button>
              </p>
              <p><a href="https://example.com/report.pdf">报告附件</a></p>
            </div>
          </div>
        </div>
      </section>
    </main>
    <form data-chatgpt-composer>
      <div class="composer-shell" data-composer-surface-variant="default">
        <div class="composer-surface">
          <div class="composer-grid">
            <div class="composer-leading">
              <button type="button" aria-label="添加附件">+</button>
            </div>
            <div class="composer-primary">
              <div
                contenteditable="true"
                role="textbox"
                data-composer-markdown
                aria-label="消息输入框"
              ></div>
            </div>
            <div class="composer-trailing">
              <button type="button" aria-label="启动语音功能">◉</button>
            </div>
          </div>
        </div>
      </div>
    </form>
    <script src="/fixture-client.js"></script>
  </body>
</html>
